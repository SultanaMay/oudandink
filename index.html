<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Oud &amp; Ink · عود وحبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&family=Reem+Kufi:wght@500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a private perfume salon at night — hushed, luxurious, precise.
   IDEA: a lacquered vanity shelf; every perfume a lit bottle standing on it.
   PICTURE: the shelf itself — drawn bottles coloured by scent family, or the user's own photo.
   COLOUR and TYPE: black lacquer ground, wine-red bands, gold leaf accents; Cormorant + Jost, Reem Kufi + Noto Sans Arabic.
   LAYOUT: wine hero with live season meter, sticky tabs, filter rail, grouped shelves of bottle cards. */
:root{color-scheme:dark;--bg:#0c0809;--panel:#16100f;--panel2:#1f1416;--wine:#5c1526;--wine2:#7d2238;--gold:#cfab62;--gold2:#ecd29a;--ink:#f3e9dc;--mute:#b2a291;--line:#3a2a24}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;overflow-x:clip}
[dir=rtl] body{font-family:"Noto Sans Arabic",Jost,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .serif{font-family:"Reem Kufi","Noto Sans Arabic",serif;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.band{padding:clamp(22px,4vw,52px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(12,8,9,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--gold2);text-decoration:none}
.logo b{font:600 28px/1 "Cormorant Garamond",serif;color:var(--gold2);letter-spacing:.02em}
.logo b i{color:var(--gold);font-style:italic}
.logo .ar{font:500 27px/1 "Reem Kufi",serif;color:var(--gold)}
nav{order:3;flex:1 1 100%;display:flex;gap:4px;justify-content:flex-start;flex-wrap:wrap;margin:0 -6px}
nav button,.lang{background:none;border:1px solid transparent;border-radius:999px;padding:9px 16px;min-height:44px;color:var(--mute)}
nav button[aria-current=true]{color:var(--bg);background:var(--gold);font-weight:600}
nav button:hover{color:var(--gold2)}
.lang{border-color:var(--line);color:var(--gold2);margin-inline-start:auto}
/* hero */
.hero{background:radial-gradient(120% 140% at 85% 0%,#8a2a43 0%,var(--wine) 38%,#2a0a13 100%);border-bottom:1px solid #6b3a2a}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:end}
.hero h1{font-size:clamp(36px,5vw,52px);color:#fff4e3}
.hero p{color:#e9cfc0;max-width:56ch;margin:10px 0 0}
.stats{display:flex;gap:clamp(14px,3vw,34px);margin-top:20px;flex-wrap:wrap}
.stat b{display:block;font:600 clamp(28px,4vw,40px)/1 "Cormorant Garamond",serif;color:var(--gold2);white-space:nowrap}
.stat small{color:#e1c2b4;font-size:13px}
.meter{background:rgba(0,0,0,.28);border:1px solid rgba(236,210,154,.25);border-radius:14px;padding:16px 18px}
.meter h3{font-size:22px;color:var(--gold2);margin-bottom:10px}
.mrow{display:grid;grid-template-columns:6.5em minmax(0,1fr) 2.5em;align-items:center;gap:10px;font-size:14px;margin:7px 0}
.mbar{height:10px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .6s}
.mrow em{font-style:normal;text-align:end;color:var(--gold2)}
/* controls */
.rail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.rail input,.rail select,.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.rail input{flex:1 1 220px}
.rail select{flex:0 1 auto}
.rail label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.btn{background:var(--gold);color:#1a0f0a;border:0;border-radius:999px;padding:11px 20px;min-height:44px;font-weight:600}
.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold)}
.btn.wine{background:var(--wine2);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mute);margin:2px}
/* groups & cards */
.group{margin:0 0 34px}
.group h2{font-size:30px;color:var(--gold2);display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.group h2 small{font:500 14px Jost,sans-serif;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:0 0 12px;text-align:start;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .pic{position:relative;aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 70%,rgba(207,171,98,.16),transparent 70%)}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic svg{width:72%;height:86%}
.card h3{font-size:21px;padding:4px 12px 0}
.card .br{color:var(--gold);font-size:13px;padding:2px 12px 0}
.card .meta{font-size:12px;color:var(--mute);padding:4px 12px 0}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--wine);color:#f6dcd0;margin-inline-start:6px;white-space:nowrap}
.empty{border:1px dashed var(--gold);border-radius:18px;padding:28px;text-align:center;color:var(--mute)}
.empty h2{color:var(--gold2);font-size:30px;margin-bottom:8px}
.note{color:var(--mute);font-size:13px}
.warn{color:#f0c27d;font-size:14px}
/* form */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 20px;max-width:980px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;color:var(--gold2)}
.field.full,.form .full{grid-column:1/-1}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px;color:var(--mute)}
.toggles button[aria-pressed=true]{background:var(--wine2);border-color:var(--gold);color:#fff}
.finder{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px;max-width:980px}
.finder .row{display:flex;gap:10px;flex-wrap:wrap}
.finder .row input{flex:1 1 220px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg button{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:start;color:var(--ink);min-height:44px}
.sugg button small{display:block;color:var(--gold);font-size:12px}
.status{margin-top:10px;min-height:1.5em}
.photo{display:flex;gap:14px;align-items:center}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,2,3,.78);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:22px;max-width:860px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.modal .pic{position:relative;background:radial-gradient(80% 70% at 50% 65%,rgba(207,171,98,.22),var(--wine) 75%);display:grid;place-items:center;min-height:300px}
.modal .pic img{width:100%;height:100%;object-fit:cover}
.modal .pic svg{width:62%;max-height:320px}
.modal .body{padding:24px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:38px;color:#fff4e3}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{background:var(--panel2);border-radius:12px;padding:10px;font-size:14px}
.pyr b{display:block;color:var(--gold2);font-size:12px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.x{position:absolute;inset-inline-end:14px;top:10px;background:none;border:0;color:var(--gold2);font-size:30px;min-width:44px;min-height:44px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.shelfcard{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:start;color:var(--ink)}
.shelfcard h3{font-size:26px;color:var(--gold2)}
.share{max-width:720px;display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.plabel{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(12,8,9,.78);color:var(--gold2);border:1px solid rgba(207,171,98,.5);border-radius:999px;padding:2px 9px;font-size:11px;white-space:nowrap}
.flink{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--gold2);border:1px solid var(--gold);border-radius:999px;padding:8px 16px;text-decoration:none;width:fit-content}.flink:hover{background:var(--gold);color:#1a0f0a}
.sec{font-size:28px;color:var(--gold2);margin:30px 0 12px}
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(18px,4vw,44px);align-items:center}
.ctx{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.ctx select{background:rgba(0,0,0,.3);border:1px solid rgba(236,210,154,.4);border-radius:10px;padding:10px 12px;min-height:44px}
.today .toggles button{background:rgba(0,0,0,.25)}
.pick{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);background:rgba(12,8,9,.55);border:1px solid var(--gold);border-radius:20px;overflow:hidden}
.pick .pic{position:relative;min-height:260px;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 70%,rgba(207,171,98,.25),transparent 70%)}.pick .pic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.pick .pic svg{width:70%;max-height:250px}
.pick .pbody{padding:20px;display:flex;flex-direction:column;gap:4px;justify-content:center}.pick h2{font-size:clamp(30px,4vw,42px);color:#fff4e3}
.chip.gold{border-color:var(--gold);color:var(--gold2)}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px}.panel.tight{padding:12px 14px}
.logform{display:grid;grid-template-columns:2fr 1fr 1fr .8fr auto;gap:12px;align-items:end}
.elist{display:flex;flex-direction:column;gap:8px}.erow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ed{color:var(--gold);min-width:4.5em;white-space:nowrap}.linkish{background:none;border:0;color:var(--ink);font-weight:600;text-align:start;min-height:44px;padding:0}.linkish:hover{color:var(--gold2)}
.comp{display:flex;align-items:center;gap:6px;margin-inline-start:auto}.comp button,.del{background:var(--panel2);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;color:var(--gold2)}.del{color:var(--mute)}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}.cell{height:44px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}.cell.on{border-color:var(--gold)}
.btnchip{background:none;cursor:pointer;min-height:40px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.gap{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.gap>span{flex:1 1 180px}.gapbox{flex-basis:100%}
.slist{display:flex;flex-direction:column;gap:8px}.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b.sm{font-size:clamp(20px,2.6vw,26px);white-space:normal}
nav button[data-v=add]{border-color:var(--gold);color:var(--gold2)}
@media(max-width:760px){.today,.pick{grid-template-columns:minmax(0,1fr)}.logform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.logform .btn{grid-column:1/-1}}
.homehero .hh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:center}
.brandtitle{font-size:clamp(46px,7vw,76px);color:#fff4e3}.brandtitle i{color:var(--gold2);font-style:italic}.brandtitle span{display:block;font:500 clamp(26px,3.5vw,38px)/1.3 "Reem Kufi",serif;color:var(--gold);margin-top:6px}
.tag{font:italic 600 clamp(22px,2.6vw,28px)/1.2 "Cormorant Garamond",serif;color:var(--gold2)!important;margin:10px 0 0!important}[dir=rtl] .tag{font-family:"Reem Kufi",serif;font-style:normal}
.shelfart{position:relative;padding:10px 0 0}.hrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;padding:0 6px}
.hb{display:grid;place-items:end center;aspect-ratio:3/4;border-radius:12px;overflow:hidden}.hb:nth-child(odd){transform:translateY(-6px)}.hb svg{width:100%;height:100%}.hb img{width:100%;height:100%;object-fit:cover;border:1px solid var(--gold);border-radius:12px}
.plank{height:14px;margin-top:2px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),#8a6a34);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.tile{grid-column:span 2;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}.tile:hover{border-color:var(--gold)}
.tile.big{grid-column:span 3}.tile.wide{grid-column:1/-1}.commtile{display:flex;gap:20px;flex-wrap:wrap}.commtile p{flex:1 1 240px;margin:0}.tile h3{font-size:28px;color:var(--gold2)}.tile>.btn{margin-top:auto;align-self:flex-start}
.mini{display:flex;gap:14px;align-items:center;background:none;border:0;color:var(--ink);text-align:start;padding:0}.mp{width:96px;height:120px;flex:none;display:grid;place-items:center;border-radius:12px;overflow:hidden;background:radial-gradient(70% 60% at 50% 70%,rgba(207,171,98,.2),transparent 70%)}.mp svg{width:80%;height:100%}.mp img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.th{width:64px;height:76px;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding:4px;display:grid;place-items:center}.th:hover{border-color:var(--gold)}.th svg{width:100%;height:100%}.th img{width:100%;height:100%;object-fit:cover}
.steps ol{margin:0 0 14px;padding-inline-start:22px;font-size:18px}.steps{margin-bottom:16px}
@media(max-width:900px){.tile,.tile.big{grid-column:span 3}}
@media(max-width:760px){.homehero .hh{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.bento{grid-template-columns:minmax(0,1fr)}.tile,.tile.big,.tile.wide{grid-column:auto}}
.commform{display:flex;gap:16px;flex-wrap:wrap;align-items:end}.commform .field{flex:1 1 260px}
.shelfcard.mine{border-color:var(--gold)}
.stars{color:var(--gold2);letter-spacing:1px}
.rev{border-top:1px solid var(--line);padding:8px 0}.rev p{margin:2px 0 0;font-size:14px}
.revform{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px}.revform textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.starpick{display:flex;gap:4px}.starpick button{background:none;border:0;font-size:30px;line-height:1;color:#4a3a30;min-width:40px;min-height:44px}.starpick button[aria-pressed=true]{color:var(--gold2)}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rgrid select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:44px}
.notebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(0,0,0,.3);border:1px solid rgba(236,210,154,.4);border-radius:14px;padding:8px;margin-top:18px}.notebox input{flex:1 1 220px;background:none;border:0;min-height:44px;font-size:16px;padding:0 8px;outline:none}
.nchip{background:var(--gold);color:#1a0f0a;border:0;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600}
.dcard{padding-bottom:12px}.cardlink{background:none;border:0;color:inherit;text-align:start;padding:0;display:flex;flex-direction:column}.dcard>.btn{margin:8px 12px 0}
.btn.sm{padding:6px 14px;min-height:38px;font-size:14px}.flink.sm{padding:6px 14px;min-height:38px;font-size:14px}
.shelfcard{display:flex;flex-direction:column;gap:8px}.sclink{background:none;border:0;color:inherit;text-align:start;padding:0}
.erow.feed{color:var(--ink);text-align:start;cursor:pointer}.erow .th{width:44px;height:54px}
.wrow{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.wrow.deal{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.wrow>.th{width:72px;height:90px;flex:none}
.wmain{flex:1;display:flex;flex-direction:column;gap:8px}.wform{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;align-items:end}.wform input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px}
.badge.gold{background:var(--gold);color:#1a0f0a}.xs{background:none;border:0;color:var(--mute);min-width:28px;min-height:28px}

.exp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

const FAMC={Floral:"#b3476b","Fruity floral":"#c4546a",Woody:"#7a5634",Amber:"#b4742c",Gourmand:"#8f5b3a","Fresh citrus":"#c7ad48",Aquatic:"#3f7f95",Aromatic:"#5f7a4f",Chypre:"#4f6b4a",Leather:"#5a3426",Musky:"#a08ea4",Spicy:"#a8462c",Tobacco:"#7d512b"};
const S={lang:"en",view:"home",db:null,user:null,me:null,owner:false,canWrite:true,bottles:[],catalog:[],shelves:[],loaded:false,slow:false,f:{q:"",gender:"",season:"",family:"",occasion:"",time:"",status:"",conc:""},group:"none",edit:null,form:null,photo:"",file:null,sample:null,canImg:false,openShelf:null,status:"",delArm:null};
try{const l=localStorage.getItem("oudink-lang");if(l==="ar"||l==="en")S.lang=l;const g=localStorage.getItem("oudink-group2");if(g)S.group=g}catch(e){}
const $=s=>document.querySelector(s);
const t=k=>T[S.lang][k]??T.en[k]??k;
const ENL={Feminine:"For her",Masculine:"For him",Unisex:"Unisex"};
const tx=v=>S.lang==="ar"?(AR[v]||v):(ENL[v]||v);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=v=>Array.isArray(v)?v.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim()):[];
const slug=s=>(String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,70))||"p";
const okImg=s=>typeof s==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(s)?s:"";
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

const FAMIMG={Floral:"floral","Fruity floral":"fruity-floral",Woody:"woody",Amber:"amber",Gourmand:"gourmand","Fresh citrus":"fresh-citrus",Aquatic:"aquatic",Aromatic:"aromatic",Chypre:"chypre",Leather:"leather",Musky:"musky",Spicy:"spicy",Tobacco:"tobacco"};
function bottleSVG(b,i){
  if(FAMIMG[b.family])return `<img class="famimg" src="img/fam/${FAMIMG[b.family]}.webp" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
  const c=FAMC[b.family]||"#7d2238",k=hash(b.name+b.brand)%3,id="g"+i+"_"+hash(b.name)%999;
  const body=[ "M28 52h64a8 8 0 0 1 8 8v86a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8V60a8 8 0 0 1 8-8z",
    "M60 50c26 0 44 20 44 50s-18 54-44 54-44-24-44-54 18-50 44-50z",
    "M36 50h48l20 26v62l-20 18H36l-20-18V76z"][k];
  const ini=esc((b.name||"?").replace(/[^A-Za-z0-9؀-ۿ ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase());
  return `<svg viewBox="0 0 120 160" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${c}" stop-opacity=".95"/><stop offset=".55" stop-color="${c}" stop-opacity=".7"/><stop offset="1" stop-color="#1a0b0e"/></linearGradient></defs>
  <ellipse cx="60" cy="155" rx="42" ry="4" fill="#000" opacity=".5"/>
  <rect x="44" y="6" width="32" height="30" rx="4" fill="#cfab62"/><rect x="44" y="6" width="8" height="30" rx="3" fill="#ecd29a" opacity=".7"/>
  <rect x="50" y="36" width="20" height="14" fill="#a8864a"/>
  <path d="${body}" fill="url(#${id})" stroke="#cfab62" stroke-width="1.5"/>
  <path d="M30 66v70" stroke="#fff" stroke-width="3" opacity=".25" stroke-linecap="round"/>
  <rect x="38" y="92" width="44" height="26" rx="3" fill="#0c0809" opacity=".55" stroke="#cfab62" stroke-width=".8"/>
  <text x="60" y="110" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="15" fill="#ecd29a">${ini}</text></svg>`;
}
const catFor=b=>S.catalog.find(c=>c.id===b.catalogId)||S.catalog.find(c=>c.id===slug(b.brand+"-"+b.name));
const photoOf=b=>{const own=okImg(b.photo);if(own)return {src:own,own:true};const c=catFor(b),cp=c?okImg(c.photo):"";return cp?{src:cp,own:false}:null};
const pic=(b,i,label)=>{const p=photoOf(b);if(!p)return bottleSVG(b,i);return `<img src="${p.src}" alt="${esc(b.name)}">${label?`<span class="plabel">${t(p.own?"yourPhoto":"commPhoto")}</span>`:""}`};
const fragURL=b=>"https://www.fragrantica.com/search/?query="+encodeURIComponent((b.brand||"").replace(/\(.*?\)/g,"").trim()+" "+(b.name||""));

/* ---------- filtering & grouping ---------- */
function matches(b){
  const f=S.f,q=f.q.trim().toLowerCase();
  if(q){const hay=[b.name,b.nameAr,b.brand,b.family,...arr(b.top),...arr(b.heart),...arr(b.base),...arr(b.accords),...arr(b.perfumers)].join(" ").toLowerCase();if(!hay.includes(q))return false}
  if(f.season&&!arr(b.seasons).includes(f.season))return false;
  if(f.occasion&&!arr(b.occasions).includes(f.occasion))return false;
  if(f.time&&!arr(b.times).includes(f.time))return false;
  if(f.family&&b.family!==f.family)return false;
  if(f.gender&&b.gender!==f.gender)return false;
  if(f.status&&(b.status||"Owned")!==f.status)return false;
  if(f.conc&&b.conc!==f.conc)return false;
  return true;
}
function keysFor(b,g){
  const one=v=>[v||"Other"];
  switch(g){case"season":return arr(b.seasons).length?arr(b.seasons):["Other"];case"occasion":return arr(b.occasions).length?arr(b.occasions):["Other"];case"time":return arr(b.times).length?arr(b.times):["Other"];
  case"family":return one(b.family);case"status":return one(b.status||"Owned");case"brand":return one(b.brand);case"conc":return one(b.conc);case"gender":return one(b.gender);case"longevity":return one(b.longevity);
  case"decade":return [b.year?Math.floor(b.year/10)*10+"s":"Other"];default:return ["*"]}
}
function orderOf(g){return {season:TAX.seasons,occasion:TAX.occasions,time:TAX.times,family:TAX.families,status:TAX.status,conc:TAX.conc,gender:TAX.gender,longevity:TAX.longevity}[g]||null}

function shelfHTML(items,ro){
  const list=items.filter(matches);
  if(!items.length)return "";
  if(!list.length)return `<p class="empty">${t("noMatch")}</p>`;
  const g=S.group,map=new Map();
  for(const b of list)for(const k of keysFor(b,g)){if(!map.has(k))map.set(k,[]);map.get(k).push(b)}
  const ord=orderOf(g);let keys=[...map.keys()];
  keys.sort((a,b)=>{if(a==="Other")return 1;if(b==="Other")return -1;if(ord)return ord.indexOf(a)-ord.indexOf(b);return a.localeCompare(b)});
  let n=0;
  return keys.map(k=>`<section class="group">${k==="*"?"":`<h2>${esc(tx(k))}<small>${map.get(k).length} ${t("items")}</small></h2>`}<div class="grid">${map.get(k).map(b=>card(b,n++,ro)).join("")}</div></section>`).join("");
}
function card(b,i,ro){
  const st=b.status&&b.status!=="Owned"?`<span class="badge">${esc(tx(b.status))}</span>`:"";
  return `<button class="card" data-act="open" data-id="${esc(b.id)}" data-ro="${ro?1:""}"><div class="pic">${pic(b,i,true)}</div><h3>${esc(S.lang==="ar"&&b.nameAr?b.nameAr:b.name)}</h3><div class="br">${esc(b.brand)}${st}</div>${b.gender?`<div class="gtag g-${esc(b.gender)}">${esc(tx(b.gender))}</div>`:""}<div class="meta">${esc([b.year,tx(b.conc),tx(b.family)].filter(Boolean).join(" · "))}${(()=>{const a=avgOf(cidOf(b));return a?` · <span class="stars">★</span>${a.r.toFixed(1)}`:""})()}</div></button>`;
}
function railHTML(){
  const sel=(key,lab,vals)=>`<select data-f="${key}" aria-label="${esc(lab)}"><option value="">${esc(lab)}: ${t("all")}</option>${vals.map(v=>`<option value="${esc(v)}"${S.f[key]===v?" selected":""}>${esc(tx(v))}</option>`).join("")}</select>`;

async function aiLookup(byPhoto){
  const q=($("#fq")?.value||"").trim(),b=($("#fb")?.value||"").trim();

  if(!S.sample){keep();S.status=t("aiOff");render();return}
  S.form=readForm();setStat(t(byPhoto?"reading":"looking"));
  try{
    const r=byPhoto?await S.sample.json(PROMPT("The image shows a perfume bottle or its box. Read the label and identify the exact perfume."),{images:[S.file]})

}

const CAT_KEYS=["name","nameAr","brand","year","perfumers","conc","family","accords","top","heart","base","seasons","occasions","times","gender","longevity"];

function rank(pool,ctx){
  return pool.map(b=>{let s=0;const r=[],se=arr(b.seasons),ti=arr(b.times),oc=arr(b.occasions);
    if(se.includes(ctx.season)){s+=3;r.push(fmt(t("rSeason"),{x:lc(ctx.season)}))}else if(!se.length)s+=1;
    if(ti.includes(ctx.time)){s+=2;r.push(fmt(t("rTime"),{x:lc(ctx.time)}))}else if(!ti.length)s+=1;
    if(oc.includes(ctx.occ)){s+=3;r.push(fmt(t("rOcc"),{x:lc(ctx.occ)}))}else if(!oc.length)s+=1;
    const lw=lastWorn(b.id);
    if(!lw){s+=1.5;r.push(t("rNever"))}else{const n=daysSince(lw);if(n<=2){s-=4;r.push(t("rRecent"))}else{s+=Math.min(n,30)/12;if(n>=7)r.push(fmt(t("rDays"),{n}))}}
    s+=(hash(b.id+todayK())%100)/300;return {b,s,r}}).sort((a,b)=>b.s-a.s);
}

/* ---------- Similar & dupes ---------- */
const norm=s=>String(s).toLowerCase().replace(/\b(absolute|absolu|madagascar|madagascan|brazilian|accord|notes?|extract|essence)\b/g,"").replace(/\s+/g," ").trim();
const noteSet=b=>new Set([...arr(b.top),...arr(b.heart),...arr(b.base),...arr(b.accords)].map(norm).filter(Boolean));
function similar(b){
  const A=noteSet(b),me=b.catalogId||slug(b.brand+"-"+b.name),seen=new Set([me]),out=[];
  const cands=[...S.bottles.map(x=>({x,own:true})),...S.catalog.map(x=>({x,own:false}))];
  for(const {x,own} of cands){const id=own?(x.catalogId||slug(x.brand+"-"+x.name)):x.id;if(seen.has(id))continue;seen.add(id);
    const B=noteSet(x),inter=[...A].filter(n=>B.has(n));if(!inter.length)continue;
    const sc=inter.length/new Set([...A,...B]).size+(x.family&&x.family===b.family?.15:0);out.push({x,own,sc,inter})}
  return out.sort((a,b)=>b.sc-a.sc).slice(0,4).filter(o=>o.sc>.08);
}
function suggHTML(items){return `<p class="note">${t("dupesNote")}</p><div class="slist">${items.map(s=>`<div class="srow"><div><b>${esc(s.name)}</b> <span style="color:var(--gold)">${esc(s.brand)}</span> <span class="badge">${esc(t(s.type)||s.type)}</span>${s.priceTier?` <span class="chip">${esc(t(s.priceTier))}</span>`:""}<div class="note">${esc(s.why)}</div></div>${S.canWrite&&S.db?`<button class="btn ghost" data-act="addwish" data-n="${esc(s.name)}" data-b="${esc(s.brand)}">${t("addWish")}</button>`:""}</div>`).join("")}</div>`}
const cleanSugg=r=>(Array.isArray(r)?r:[]).filter(s=>s&&s.name&&s.brand).slice(0,6).map(s=>({name:String(s.name).slice(0,80),brand:String(s.brand).slice(0,60),type:["dupe","alternative","upgrade"].includes(s.type)?s.type:"alternative",priceTier:["budget","mid","luxury"].includes(s.priceTier)?s.priceTier:"",why:String(s.why||"").slice(0,200)}));
const SUGG_FMT=`Reply with only a JSON array, e.g. [{"name":"","brand":"","type":"dupe|alternative|upgrade","priceTier":"budget|mid|luxury","why":"one short sentence"}]. Only include perfumes you are confident really exist.`;

function insightsHTML(){

  const count=(f)=>{const m={};for(const b of pool)for(const k of f(b))m[k]=(m[k]||0)+1;return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const label=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const notes=count(b=>[...new Set([...arr(b.top),...arr(b.heart),...arr(b.base)].map(norm).filter(Boolean))]).slice(0,10);
  const fams=count(b=>b.family?[b.family]:[]),houses=count(b=>b.brand?[b.brand]:[]).slice(0,6);
  const seas=TAX.seasons.map(s=>[s,pool.filter(b=>arr(b.seasons).includes(s)).length]),tm=TAX.times.map(s=>[s,pool.filter(b=>arr(b.times).includes(s)).length]);

  if(!pool.some(b=>["Fresh citrus","Aquatic"].includes(b.family)))gaps.push(t("gapFresh"));
  const line=fmt(t("profileLine"),{notes:notes.slice(0,3).map(([n])=>n).join(S.lang==="ar"?"، ":", "),fams:fams.slice(0,2).map(([f])=>lc(f)).join(S.lang==="ar"?" و":" & ")});
  const box=(title,rows,lab)=>`<div class="panel"><h3 class="sec" style="margin:0 0 10px">${title}</h3>${bars(rows.map(([k,c])=>[lab?lab(k):k,c]),Math.max(1,...rows.map(r=>r[1])))}</div>`;
  return head+`<p class="serif" style="font-size:clamp(22px,3vw,30px);color:var(--gold2);margin-top:14px">${esc(line)}</p></div></section>

   ${box(t("topNotes"),notes,label)}${box(t("families"),fams,tx)}${box(t("seasonsCov"),seas,tx)}${box(t("dayNight"),tm,tx)}${box(t("houses"),houses)}
   <div class="panel"><h3 class="sec" style="margin:0 0 10px">${t("gaps")}</h3>${gaps.length?gaps.map((g,i)=>`<div class="gap"><span>${esc(g)}</span><button class="btn ghost" data-act="gapsugg" data-i="${i}">${t("findGap")}</button><div class="gapbox" id="gap${i}">${S.sugg["g"+i]||""}</div></div>`).join(""):`<p class="note">${t("noGaps")}</p>`}</div>
  </div></div></section>`;
}
async function gapSuggest(i,btn){
  const g=btn.parentElement.querySelector("span").textContent,box=$("#gap"+i);
  if(!S.sample){box.innerHTML=`<p class="note">${t("aiOff")}</p>`;return}
  box.innerHTML=`<p class="note">${t("thinking")}</p>`;btn.disabled=true;
  const loved=[...new Set(S.bottles.flatMap(b=>[...arr(b.top),...arr(b.heart),...arr(b.base)]))].slice(0,25).join(", ");
  try{const r=await S.sample.json(`A perfume collector has this gap: "${g}". They own: ${S.bottles.map(b=>b.name+" by "+b.brand).join("; ")}. Notes they love: ${loved}. Suggest 5 real perfumes that would fill the gap and still suit their taste, mixing Arabic/Middle Eastern houses and international brands at different prices (type "alternative"). ${SUGG_FMT}`);
    const items=cleanSugg(r);S.sugg["g"+i]=items.length?suggHTML(items):`<p class="note">${t("aiFail")}</p>`;box.innerHTML=S.sugg["g"+i]}
  catch(e){box.innerHTML=`<p class="note">${t(e?.code==="not_granted"?"aiOff":"aiFail")}</p>`}
  btn.disabled=false;
}

S.dq={notes:[],any:false,gender:"",family:"",season:"",text:""};S.reviews={};S.prefs={follows:[]};S.wishlists=[];S.openWish=null;S.modalItem=null;S.downloads=null;

function revList(cid){return Object.entries(S.reviews).map(([uid,d])=>d&&d[cid]&&typeof d[cid]==="object"?{uid,...d[cid]}:null).filter(r=>r&&r.r>=1&&r.r<=5)}
function avgOf(cid){const L=revList(cid);return L.length?{n:L.length,r:L.reduce((a,x)=>a+x.r,0)/L.length}:null}
function revName(uid){if(uid===S.me)return t("you");const s=S.shelves.find(x=>x.id===uid&&x.public);return s?.title||t("collector")}
function reviewsHTML(b){
  const cid=cidOf(b),L=revList(cid),mine=S.reviews[S.me]?.[cid]||{};
  const av=k=>{const v=L.filter(x=>x[k]>0);return v.length?+(v.reduce((a,x)=>a+x[k],0)/v.length).toFixed(1):0};
  const head=L.length?`<p style="margin:6px 0"><span class="stars">${starsTxt(av("r"))}</span> <b>${av("r").toFixed(1)}</b> · ${L.length} ${S.lang==="en"&&L.length===1?"review":t("reviews")}</p>${bars([[t("longevity"),av("lo")],[t("projection"),av("pr")],[t("valueR"),av("va")]],5)}`:`<p class="note">${t("noRev")}</p>`;

async function saveReview(cid,del){
  const cur={...(S.reviews[S.me]||{})};
  if(del)delete cur[cid];else{
    const r=Number($(".starpick")?.dataset.v||0);if(r<1){$("#revstat").textContent=t("needStar");return}
    cur[cid]={r,lo:Number($("#rv_lo").value)||0,pr:Number($("#rv_pr").value)||0,va:Number($("#rv_va").value)||0,txt:($("#rv_txt").value||"").trim().slice(0,280),at:Date.now()}}
  try{await S.db.doc("reviews/"+S.me).set(cur);S.reviews[S.me]=cur;const rb=$("#revbox");if(rb&&S.modalItem)rb.outerHTML=reviewsHTML(S.modalItem);const st=$("#revstat");if(st)st.textContent=t("saved")}
  catch(e){const st=$("#revstat");if(st)st.textContent=t("errSave")}
}

    if(D.family&&c.family!==D.family)return false;if(D.gender&&c.gender!==D.gender)return false;if(D.season&&!arr(c.seasons).includes(D.season))return false;
    if(D.text){const q=D.text.toLowerCase();if(!((c.name||"")+" "+(c.brand||"")+" "+(c.nameAr||"")).toLowerCase().includes(q))return false}return true});
  const pop={};for(const c of cat)for(const n of noteSet(c))pop[n]=(pop[n]||0)+1;

   <p class="note" style="margin-top:12px">${t("popular")}:</p><div>${popular.filter(n=>!D.notes.includes(n)).map(n=>`<button class="chip btnchip" data-act="dnadd" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div></div></section>
  <section class="band"><div class="wrap">${banner()}

    <label class="check"><input type="checkbox" id="dall"${D.any?"":" checked"}> ${t("matchAll")}</label>${D.notes.length||D.gender||D.family||D.season||D.text?`<button class="btn ghost" data-act="dclear">${t("clear")}</button>`:""}</div>
   ${(()=>{const q=[...D.notes,D.text.trim()].filter(Boolean).join(" ");const u="https://www.fragrantica.com/search/"+(q?"?query="+encodeURIComponent(q):"");return `<div class="fragbar${res.length<4?" strong":""}"><p class="note" style="margin:0">${S.lang==="en"&&res.length===1?"1 perfume":fmt(t("resultsN"),{n:res.length})}${res.length<4?" · "+t("fragSearchP"):""}</p><span class="acts">${S.sample?`<button class="btn wine sm" data-act="dclaude">✦ ${t("askClaude")}</button>`:""}<a class="flink sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t("fragSearch")}</a></span></div>${dClaudeHTML()}`})()}
   <div class="grid">${res.map((c,i)=>{const m=mineFor(c.id),av=avgOf(c.id),hit=D.notes.length?[...noteSet(c)].filter(x=>D.notes.some(n=>x.includes(n))):[];
    return `<div class="card dcard"><button class="cardlink" data-act="opencat" data-id="${esc(c.id)}"><div class="pic">${pic(c,900+i,true)}</div><h3>${esc(nameOf(c))}</h3><div class="br">${esc(c.brand)}${m?`<span class="badge">${t((m.status||"Owned")==="Wishlist"?"wishB":"ownedB")}</span>`:""}</div>${c.gender?`<div class="gtag g-${esc(c.gender)}">${esc(tx(c.gender))}</div>`:""}<div class="meta">${esc([c.year,tx(c.family)].filter(Boolean).join(" · "))}${av?` · <span class="stars">★</span>${av.r.toFixed(1)}`:""}</div>${hit.length?`<div class="meta" style="color:var(--gold2)">${esc(hit.slice(0,3).join(", "))}</div>`:""}</button>

/* discover with Claude */
S.dc={key:"",state:"",items:[]};
const dKey=()=>stable({g:S.dq.gender,n:S.dq.notes,a:S.dq.any,f:S.dq.family,s:S.dq.season,t:S.dq.text.trim().toLowerCase()});
function dClaudeHTML(){
  const c=S.dc;if(c.key!==dKey()||!c.state)return "";
  if(c.state==="need")return `<p class="warn">${t("claudeNeed")}</p>`;
  if(c.state==="load")return `<div class="panel claude"><p class="note">${t("thinking")}</p></div>`;
  if(c.state==="err")return `<div class="panel claude"><p class="note">${esc(c.msg||t("aiFail"))}</p></div>`;
  return `<div class="panel claude"><h3 class="sec" style="margin:0 0 4px">✦ ${t("claudeT")}</h3><p class="note" style="margin:0 0 12px">${t("claudeP")}</p><div class="slist">${c.items.map((s,i)=>`<div class="srow"><div style="display:flex;gap:12px;align-items:center"><span class="th">${bottleSVG(s,1200+i)}</span><div><b>${esc(s.name)}</b> <span style="color:var(--gold)">${esc(s.brand)}</span>${s.year?` <span class="note">· ${esc(s.year)}</span>`:""}${s.gender?` <span class="gtag g-${esc(s.gender)}">${esc(tx(s.gender))}</span>`:""}${s.family?` <span class="chip">${esc(tx(s.family))}</span>`:""}<div class="note">${t("keyNotes")}: ${esc(s.notes.join(", "))}</div><div class="note">${esc(s.why)}</div></div></div>
   ${S.canWrite&&S.db?`<span class="acts"><button class="btn ghost sm" data-act="dcadd" data-i="${i}" data-s="Wishlist">${t("addWish")}</button><button class="btn ghost sm" data-act="dcadd" data-i="${i}" data-s="Owned">${t("addShelf")}</button></span>`:""}</div>`).join("")}</div><p class="note" style="margin:10px 0 0">${t("dupesNote")}</p></div>`;
}
async function discoverClaude(){
  const D=S.dq,key=dKey();
  if(!D.notes.length&&!D.gender&&!D.family&&!D.season&&!D.text.trim()){S.dc={key,state:"need",items:[]};return render()}
  S.dc={key,state:"load",items:[]};render();
  const want=[D.gender?({Feminine:"for women",Masculine:"for men",Unisex:"unisex"})[D.gender]:"",D.notes.length?`notes: ${D.notes.join(D.any?" or ":" and ")}`:"",D.family?`scent family: ${D.family}`:"",D.season?`good for ${D.season}`:"",D.text.trim()?`name or brand contains "${D.text.trim()}"`:""].filter(Boolean).join("; ");
  const have=S.catalog.map(c=>c.name+" by "+c.brand).slice(0,150).join("; ");
  try{
    const r=await S.sample.json(`A perfume lover is searching for perfumes with ${want}. Suggest 8 real perfumes that match well and are NOT in this list they already know: ${have||"(none)"}. Mix well-known designer, niche, and Arabic/Middle Eastern houses, at different prices. Only include perfumes you are confident exist, with notes as the brand publishes them.
Reply with only a JSON array: [{"name":"","brand":"","year":2019,"family":"one of ${TAX.families.join("|")}","gender":"one of Feminine|Masculine|Unisex","notes":["up to 6 key notes, lowercase"],"why":"one short sentence on why it matches"}]`,{cache:{gcTime:6e5}});
    const known=new Set(S.catalog.map(c=>slug(c.brand+"-"+c.name)));
    const items=(Array.isArray(r)?r:[]).filter(s=>s&&s.name&&s.brand&&!known.has(slug(s.brand+"-"+s.name))).slice(0,8).map(s=>({name:String(s.name).slice(0,80),brand:String(s.brand).slice(0,60),year:Number(s.year)>1700?Number(s.year):"",family:TAX.families.includes(s.family)?s.family:"",gender:TAX.gender.includes(s.gender)?s.gender:"",notes:arr(s.notes).slice(0,6).map(String),why:String(s.why||"").slice(0,200)}));
    if(S.dc.key!==key)return;
    S.dc=items.length?{key,state:"ok",items}:{key,state:"err",items:[]};
  }catch(e){if(S.dc.key!==key)return;S.dc={key,state:"err",items:[],msg:t(e?.code==="not_granted"||e?.code==="sampling_disabled"?"aiOff":"aiFail")}}
  if(S.view==="discover")render();
}

/* follows & feed */
async function toggleFollow(h){const f=new Set(S.prefs.follows||[]);f.has(h)?f.delete(h):f.add(h);S.prefs={...S.prefs,follows:[...f]};render();try{await S.db.collection("data/users/"+S.me).doc("_prefs").set(S.prefs)}catch(_){setStat(t("errSave"))}}
const followBtn=s=>s.id===S.me||!S.db||!S.canWrite?"":`<button class="btn ghost sm" data-act="follow" data-h="${esc(s.handle)}" aria-pressed="${(S.prefs.follows||[]).includes(s.handle)}">${t((S.prefs.follows||[]).includes(s.handle)?"following":"follow")}</button>`;
function feedHTML(){
  const fl=S.prefs.follows||[],sh=S.shelves.filter(s=>s.public&&fl.includes(s.handle)&&s.id!==S.me&&Array.isArray(s.items));
  const items=sh.flatMap(s=>s.items.map((b,i)=>({s,b,i}))).sort((a,b)=>(b.b.addedAt||0)-(a.b.addedAt||0)).slice(0,12);

function loadLib(src,glob){if(window[glob])return Promise.resolve(window[glob]);return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res(window[glob]);s.onerror=rej;document.head.appendChild(s)})}
function exportRows(){return S.bottles.map(b=>{const w=wears(b.id);return {[t("fName")]:b.name,[t("fNameAr")]:b.nameAr||"",[t("fBrand")]:b.brand,[t("fYear")]:b.year||"",[t("fPerf")]:arr(b.perfumers).join(", "),[t("fConc")]:tx(b.conc)||"",[t("fFam")]:tx(b.family)||"",[t("fAcc")]:arr(b.accords).join(", "),[t("fTop")]:arr(b.top).join(", "),[t("fHeart")]:arr(b.heart).join(", "),[t("fBase")]:arr(b.base).join(", "),[t("fSeasons")]:arr(b.seasons).map(tx).join(", "),[t("fOcc")]:arr(b.occasions).map(tx).join(", "),[t("fTime")]:arr(b.times).map(tx).join(", "),[t("fGender")]:tx(b.gender)||"",[t("fLong")]:tx(b.longevity)||"",[t("fSize")]:b.sizeMl||"",[t("fPrice")]:b.price||"",[t("fCur")]:b.price?b.currency||"":"",[t("fStatus")]:tx(b.status||"Owned"),[t("wearStats")]:w.length,[t("compliments")]:w.reduce((a,e)=>a+(e.c||0),0),[t("fNotes")]:b.notes||""}})}
async function exportFile(kind,btn){
  if(!S.downloads||!S.bottles.length)return;btn.disabled=true;setStat(t("exporting"));
  try{
    let blob,name;
    if(kind==="xlsx"){
      const X=await loadLib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","XLSX");
      const wb=X.utils.book_new(),ws=X.utils.json_to_sheet(exportRows());ws["!cols"]=Object.keys(exportRows()[0]).map(()=>({wch:18}));X.utils.book_append_sheet(wb,ws,"Collection");
      if(S.diary.length)X.utils.book_append_sheet(wb,X.utils.json_to_sheet([...S.diary].sort((a,b)=>a.d.localeCompare(b.d)).map(e=>({[t("date")]:e.d,[t("perfume")]:nameOf(byId(e.b)),[t("occasion")]:tx(e.o)||"",[t("compliments")]:e.c||0}))),"Wear diary");
      blob=new Blob([X.write(wb,{type:"array",bookType:"xlsx"})]);name="Oud-and-Ink-collection.xlsx";
    }else{
      const h2c=await loadLib("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","html2canvas");await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","jspdf");
      const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),per=9,B=S.bottles,pages=Math.ceil(B.length/per);
      const host=document.createElement("div");host.style.cssText="position:fixed;left:-12000px;top:0;width:794px";document.body.appendChild(host);
      try{for(let p=0;p<pages;p++){host.innerHTML=pdfPage(B.slice(p*per,p*per+per),p,pages);try{await document.fonts?.ready}catch(_){}
        const c=await h2c(host.firstElementChild,{scale:2,backgroundColor:"#0c0809",useCORS:false,logging:false});if(p)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.9),"JPEG",0,0,595.28,841.89)}}
      finally{host.remove()}
      blob=pdf.output("blob");name="Oud-and-Ink-collection.pdf";
    }
    await S.downloads.save({filename:name,data:blob});setStat(t("exported"));
  }catch(e){setStat(e?.code==="declined"?"":t("exportFail"))}
  btn.disabled=false;
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="close"){if(el.classList.contains("scrim")&&e.target!==el)return;closeModal();return}
  if(a==="nav")return go(el.dataset.v);
  if(a==="lang"){S.lang=S.lang==="ar"?"en":"ar";try{localStorage.setItem("oudink-lang",S.lang)}catch(_){};if(S.view==="add")S.form=readForm();return render()}
  if(a==="open"){const b=findItem(el.dataset.id,!!el.dataset.ro);if(b)openDetail(b,!!el.dataset.ro);return}

  if(a==="logentry"){const b=$("#d_b")?.value,d=$("#d_date")?.value;if(b&&/^\d{4}-\d\d-\d\d$/.test(d||""))logWear(b,$("#d_o").value,d,$("#d_c").value);return}

  if(a==="delentry"){saveDiary(S.diary.filter(x=>x.k!==el.dataset.k));return}

  if(a==="addwish")return goAddLookup(el.dataset.n,el.dataset.b);

  if(a==="relook"){const f=readForm();for(const k of ["name","brand","nameAr","year","perfumers","family","gender","accords","top","heart","base","seasons","occasions","times"])f[k]=Array.isArray(f[k])?[]:"";f.flag="";f.locked=false;f.catalogId="";S.form=f;S.status="";render();scrollTo(0,0);const q=$("#fq");if(q){q.value="";q.focus()}return}

});

  if(el.dataset.tp){const v=Number(el.value)||0,b=byId(el.dataset.tp);if(b&&v!==(b.targetPrice||0))updBottle(b.id,{targetPrice:v})}

  if(el.id==="fphoto"&&el.files[0]){S.form=readForm();try{S.form.photo=await compress(el.files[0])}catch(_){};render()}
  if(el.id==="fimg"&&el.files[0]){S.file=el.files[0];S.form=readForm();try{S.form.photo=await compress(el.files[0])}catch(_){};aiLookup(true)}
});
document.addEventListener("focusout",e=>{if(e.target.id==="mnotes")saveNotes(e.target)});
document.addEventListener("keydown",e=>{if(e.target.id==="dnote"&&(e.key==="Enter"||e.key===",")){e.preventDefault();const v=norm(e.target.value.replace(/,/g,""));if(v&&!S.dq.notes.includes(v))S.dq.notes.push(v);render();$("#dnote")?.focus();return}
if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();if(e.key==="Enter"&&(e.target.id==="fq"||e.target.id==="fb"))aiLookup(false)});

/* ---------- boot ---------- */
fromHash();
(async()=>{
  const C=window.claude;if(!C){render();return}
  const [db,user,sample,downloads]=await Promise.all([C.use("db"),C.use("user"),C.use("sample"),C.use("downloads")]);S.downloads=downloads;
  S.db=db;S.user=user;S.sample=sample;
  if(sample){const lim=await sample.limits().catch(()=>null);S.canImg=!!lim?.images}
  if(user){S.me=await user.id().catch(()=>null);S.owner=!!(await Promise.resolve(user.isOwner()).catch(()=>false));const cw=await Promise.resolve(user.can?.("data.write")).catch(()=>null);if(cw===false)S.canWrite=false}
  if(!db){S.db=null;render();return}if(!S.me){S.canWrite=false;S.me="signed-out"}
  const timer=setTimeout(()=>{S.slow=true;render()},10000);
  const done=()=>{clearTimeout(timer);S.slow=false};
  db.collection("data/users/"+S.me).onSnapshot(s=>{const dd=s.docs.find(d=>d.id==="_diary");S.diary=Array.isArray(dd?.data()?.entries)?dd.data().entries.filter(e=>e&&typeof e.d==="string"&&/^\d{4}-\d\d-\d\d$/.test(e.d)):[];const pf=s.docs.find(d=>d.id==="_prefs");S.prefs={follows:[],...(pf?.data()||{})};if(!Array.isArray(S.prefs.follows))S.prefs.follows=[];S.bottles=s.docs.filter(d=>!d.id.startsWith("_")).map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));if(!s.metadata.fromCache){S.loaded=true;done();scheduleSync()}if(S.view!=="add")render()},()=>{done();render()});
  db.collection("catalog").onSnapshot(s=>{S.catalog=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));if(["shelf","shelfview","home","discover"].includes(S.view))render();if(S.view==="add"){const cs=$("#catsugg"),q=$("#fq");if(cs)cs.innerHTML=catSuggHTML(q?q.value:"")}},()=>{});
  db.collection("shelves").onSnapshot(s=>{S.shelves=s.docs.map(d=>({...d.data(),id:d.id}));scheduleSync();if(["community","shelfview","home"].includes(S.view))render()},()=>{});
  db.collection("wishlists").onSnapshot(s=>{S.wishlists=s.docs.map(d=>({...d.data(),id:d.id}));scheduleSync();if(["wishlist","gift"].includes(S.view))render()},()=>{});
  db.collection("reviews").onSnapshot(s=>{const R={};for(const d of s.docs)R[d.id]=d.data()||{};S.reviews=R;const rb=$("#revbox");if(rb&&S.modalItem&&!rb.contains(document.activeElement))rb.outerHTML=reviewsHTML(S.modalItem);if(["shelf","discover","shelfview"].includes(S.view))render()},()=>{});
  render();
})();
}
</script>
